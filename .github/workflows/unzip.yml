name: Extract ZIP in Repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip archive
        run: |
          unzip -o "saveweb2zip-com-www-roblox-com.zip" -d extracted_site
          rm "saveweb2zip-com-www-roblox-com.zip"

      - name: Commit and push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract saveweb2zip-com-www-roblox-com.zip"
          git push
